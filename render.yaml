services:
  - type: web
    name: grabaseat-backend
    env: node
    region: oregon
    plan: free
    buildCommand: cd backend && npm install --include=dev && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: DB_URL
        fromDatabase:
          name: grabaseat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: grabaseat-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SEAT_HOLD_TTL_SECONDS
        value: 600
      - key: OFFER_TTL_SECONDS
        value: 300
      - key: FRONTEND_URL
        value: https://grabaseat.vercel.app
      - key: BACKEND_URL
        value: https://grabaseat-backend.onrender.com

  - type: redis
    name: grabaseat-redis
    region: oregon
    plan: free
    ipAllowList: []

databases:
  - name: grabaseat-db
    databaseName: ticket_booking
    user: grabaseat_user
    region: oregon
    plan: free
